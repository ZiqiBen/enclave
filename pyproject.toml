[project]
name = "enclave"
version = "0.1.0"
description = "Zero-egress retrieval and answer engine, open weights only"
requires-python = ">=3.11"

# NOTE on torch: the PyPI wheel is CPU-only on Windows/Linux but ships
# with MPS support on macOS. So `uv sync` alone gives a working install
# everywhere -- Apple Silicon gets acceleration for free, Windows gets
# CPU. For CUDA on Windows, install the accelerated wheel explicitly:
#
#   uv pip install torch --index-url https://download.pytorch.org/whl/cu124
#
# This asymmetry is intentional: the default install produces the
# `portable` profile on every machine, and CUDA is opted into.
dependencies = [
    "torch>=2.4",
    "transformers>=4.51",
    "sentence-transformers>=3.4",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "redis>=5.2",
    "httpx>=0.27",           # Ollama client
    "pymupdf>=1.24",         # PDF parsing
    "markdown-it-py>=3.0",   # Markdown parsing
    "beautifulsoup4>=4.12",  # HTML parsing
    "datasketch>=1.6",       # MinHash dedup
    "ranx>=0.3",             # NDCG/MRR/Recall -- pure Python, installs
                             # cleanly on Windows and arm64, unlike
                             # pytrec_eval
    "datasets>=3.0",         # BEIR corpora
    "rank-bm25>=0.2",        # scoring comparison vs Postgres ts_rank_cd
    "typer>=0.13",
    "rich>=13.9",
]

[project.optional-dependencies]
# Index benchmark comparators (Sprint 2). Not load-bearing: the product
# runs on pgvector; these exist to be measured against it.
bench = [
    "usearch>=2.16",
    "faiss-cpu>=1.9; platform_machine != 'arm64'",
]
# LoRA domain adaptation (Sprint 4). Runs on the CUDA machine.
train = [
    "peft>=0.14",
    "accelerate>=1.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
enclave-migrate = "enclave.db:cli_migrate"
enclave-ingest = "enclave.ingest.pipeline:cli"
enclave-eval = "enclave.eval.run:cli"
enclave-api = "enclave.api.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enclave"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]
# PTH is on deliberately: it flags os.path usage and pushes everything
# onto pathlib, which is how the codebase stays Windows/macOS clean.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "models: requires local model weights (skipped in CI)",
    "db: requires a running Postgres",
    "egress: must pass with all outbound network access blocked",
]
