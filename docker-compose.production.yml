name: enclave-production

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: enclave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: enclave
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enclave -d enclave"]
      interval: 5s
      timeout: 5s
      retries: 20
    command: >
      postgres
      -c maintenance_work_mem=512MB
      -c shared_buffers=512MB
    networks: [frontend, backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENCLAVE_DATABASE_URL: postgresql://enclave:${POSTGRES_PASSWORD}@db:5432/enclave
      ENCLAVE_REDIS_URL: redis://redis:6379/0
      ENCLAVE_OLLAMA_URL: ${ENCLAVE_OLLAMA_URL:-http://host.docker.internal:11434}
      ENCLAVE_OFFLINE_ONLY: "1"
      ENCLAVE_API_HOST: 0.0.0.0
      ENCLAVE_API_PORT: 8000
      ENCLAVE_COOKIE_SECURE: "true"
      ENCLAVE_SESSION_HOURS: ${ENCLAVE_SESSION_HOURS:-24}
      ENCLAVE_UPLOAD_DIR: /app/data/uploads
      HF_HOME: /models
    volumes:
      - ${ENCLAVE_MODEL_CACHE:?set ENCLAVE_MODEL_CACHE}:/models:ro
      - uploads:/app/data/uploads
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"
      interval: 15s
      timeout: 8s
      start_period: 120s
      retries: 10
    networks: [backend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ENCLAVE_DOMAIN: ${ENCLAVE_DOMAIN:?set ENCLAVE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
  redis_data:
  uploads:
  caddy_data:
  caddy_config:
