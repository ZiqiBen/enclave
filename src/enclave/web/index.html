<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Private, cited answers from your local knowledge base." />
    <title>Enclave · Private knowledge, grounded answers</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <script src="/assets/app.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Enclave home">
          <span class="brand-mark">E</span>
          <span>ENCLAVE</span>
        </a>
        <div class="top-actions">
          <button class="library-button" id="library-open" type="button">Knowledge base <span id="document-count">0</span></button>
          <div class="status" id="status" role="status">
            <span class="status-dot"></span>
            <span id="status-text">Connecting</span>
          </div>
        </div>
      </header>

      <main>
        <section class="intro" id="intro">
          <p class="eyebrow">LOCAL KNOWLEDGE ENGINE</p>
          <h1>Ask your private<br /><em>knowledge.</em></h1>
          <p class="intro-copy">
            Search the PostgreSQL documentation with answers that stay local,
            show their sources, and verify every claim.
          </p>
          <div class="suggestions" aria-label="Suggested questions">
            <button type="button" data-question="What is PostgreSQL?">What is PostgreSQL?</button>
            <button type="button" data-question="When should I use a GIN index?">When should I use a GIN index?</button>
            <button type="button" data-question="How does VACUUM reclaim storage?">How does VACUUM work?</button>
          </div>
        </section>

        <section class="conversation" id="conversation" aria-live="polite"></section>
      </main>

      <footer class="composer-wrap">
        <form class="composer" id="query-form">
          <label class="sr-only" for="query">Ask the knowledge base</label>
          <textarea id="query" rows="1" maxlength="4000" placeholder="Ask the PostgreSQL knowledge base…" required></textarea>
          <button class="send" id="send" type="submit" aria-label="Send question">
            <span>Ask</span><span aria-hidden="true">↗</span>
          </button>
        </form>
        <p class="privacy-note"><span>●</span> Runs locally · Answers cite indexed evidence</p>
      </footer>
    </div>

    <dialog class="library" id="library">
      <div class="library-head">
        <div>
          <p class="eyebrow">PRIVATE LIBRARY</p>
          <h2>Knowledge base</h2>
        </div>
        <button class="close-button" id="library-close" type="button" aria-label="Close knowledge base">×</button>
      </div>
      <form class="drop-zone" id="upload-form">
        <input id="document-file" type="file" accept=".pdf,.md,.markdown,.html,.htm,.txt" required />
        <label for="document-file">
          <strong>Drop a document here</strong>
          <span>or choose a PDF, Markdown, HTML, or text file · max 20 MB</span>
        </label>
        <button class="upload-button" id="upload-button" type="submit">Import document</button>
      </form>
      <p class="upload-message" id="upload-message" role="status"></p>
      <div class="document-list" id="document-list"></div>
    </dialog>

    <template id="loading-template">
      <article class="turn assistant-turn loading-card">
        <div class="turn-label"><span class="mini-mark">E</span> Enclave</div>
        <div class="thinking"><i></i><i></i><i></i><span>Searching and verifying evidence</span></div>
      </article>
    </template>
  </body>
</html>
