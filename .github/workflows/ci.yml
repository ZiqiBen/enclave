name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  # The portability guarantee. Windows and macOS are first-class, not
  # afterthoughts -- a platform-specific bug fails a build here rather than
  # surfacing during a demo.
  #
  # macos-14 is arm64 (Apple Silicon). Hosted runners have no GPU, so this
  # matrix proves correctness everywhere, not model performance.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev

      # Device resolution must return something sane on every platform and
      # must never raise. This is the whole cross-platform abstraction.
      - name: Resolve device
        run: uv run python -c "from enclave.config import platform_tag; print(platform_tag())"

      # Model weights are intentionally never downloaded by CI.
      - run: uv run pytest -m "not models and not db and not egress"

  # Hybrid retrieval is SQL, so it needs a real Postgres with pgvector.
  # Linux only: service containers are not available on macOS runners.
  db-integration:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: enclave
          POSTGRES_PASSWORD: enclave
          POSTGRES_DB: enclave
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U enclave -d enclave"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      - run: uv sync --frozen --extra dev
      - run: uv run enclave-migrate
      # This excludes the real-model zero-egress test while retaining every
      # deterministic database integration test.
      - run: uv run pytest -m "db and not models"
